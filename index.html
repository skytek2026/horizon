<style data-sheet="app">/* ============================================================
   Skytek Image Caption Studio — Core stylesheet
   Dark-first theme grounded in the Skytek Design System tokens.
   Author: Skytek Studio
   ============================================================ */

/* ---- Fonts (self-hosted, offline-safe) ---- */
/* ============================================================
   TOKENS — Dark theme (default)
   ============================================================ */
:root {
  /* Brand accent (per product spec) */
  --accent:        #00AEEF;
  --accent-600:    #0098cf;
  --accent-400:    #38c6fb;
  --accent-soft:   rgba(0, 174, 239, 0.14);
  --accent-ring:   rgba(0, 174, 239, 0.36);

  /* Status */
  --success:       #22C55E;
  --success-soft:  rgba(34, 197, 94, 0.14);
  --warning:       #F59E0B;
  --warning-soft:  rgba(245, 158, 11, 0.14);
  --danger:        #EF4444;
  --danger-soft:   rgba(239, 68, 68, 0.14);

  /* Surfaces (slate ramp from Skytek DS) */
  --bg-app:        #0B1220;
  --bg-canvas:     #0E1626;
  --panel:         #1F2937;
  --panel-2:       #1a2433;
  --panel-3:       #243042;
  --raised:        #283548;
  --hover:         rgba(255, 255, 255, 0.05);
  --hover-strong:  rgba(255, 255, 255, 0.09);

  /* Glass */
  --glass:         rgba(31, 41, 55, 0.62);
  --glass-border:  rgba(255, 255, 255, 0.10);
  --glass-hi:      rgba(255, 255, 255, 0.06);

  /* Borders */
  --border:        rgba(255, 255, 255, 0.09);
  --border-strong: rgba(255, 255, 255, 0.16);
  --border-faint:  rgba(255, 255, 255, 0.05);

  /* Text */
  --text:          #F3F4F6;
  --text-2:        #B6C0CE;
  --text-3:        #8A95A6;
  --text-muted:    #6B7686;
  --text-inverse:  #0B1220;

  /* Typography */
  --font-sans:    "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-display: "Exo", "Inter", system-ui, sans-serif;
  --font-mono:    "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  /* Spacing (4pt grid) */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s7:32px; --s8:40px; --s9:48px; --s10:64px;

  /* Radius */
  --r-xs:4px; --r-sm:6px; --r-md:8px; --r-lg:12px; --r-xl:16px; --r-2xl:22px; --r-pill:9999px;

  /* Shadows */
  --sh-1: 0 1px 2px rgba(0,0,0,0.30);
  --sh-2: 0 4px 12px -2px rgba(0,0,0,0.45), 0 2px 4px -2px rgba(0,0,0,0.35);
  --sh-3: 0 12px 28px -6px rgba(0,0,0,0.55), 0 6px 12px -6px rgba(0,0,0,0.40);
  --sh-4: 0 28px 60px -12px rgba(0,0,0,0.70), 0 12px 24px -10px rgba(0,0,0,0.50);
  --sh-glow: 0 0 0 1px var(--accent-ring), 0 8px 24px -6px rgba(0,174,239,0.40);

  /* Motion */
  --m-fast: 120ms; --m-base: 200ms; --m-slow: 340ms;
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-io: cubic-bezier(0.4, 0, 0.2, 1);

  /* Z */
  --z-sticky: 100; --z-dropdown: 800; --z-overlay: 1000; --z-modal: 1100; --z-toast: 1200;

  --sidebar-w: 248px;
  --topbar-h: 64px;

  color-scheme: dark;
}

/* ---- Light theme override ---- */
[data-theme="light"] {
  --bg-app:        #F4F6FA;
  --bg-canvas:     #EAEEF4;
  --panel:         #FFFFFF;
  --panel-2:       #F7F9FC;
  --panel-3:       #EEF2F7;
  --raised:        #FFFFFF;
  --hover:         rgba(15, 23, 42, 0.04);
  --hover-strong:  rgba(15, 23, 42, 0.08);
  --glass:         rgba(255, 255, 255, 0.72);
  --glass-border:  rgba(15, 23, 42, 0.10);
  --glass-hi:      rgba(15, 23, 42, 0.03);
  --border:        rgba(15, 23, 42, 0.11);
  --border-strong: rgba(15, 23, 42, 0.20);
  --border-faint:  rgba(15, 23, 42, 0.06);
  --text:          #111827;
  --text-2:        #374151;
  --text-3:        #6B7280;
  --text-muted:    #9CA3AF;
  --text-inverse:  #FFFFFF;
  --sh-1: 0 1px 2px rgba(15,23,42,0.08);
  --sh-2: 0 4px 12px -2px rgba(15,23,42,0.12), 0 2px 4px -2px rgba(15,23,42,0.08);
  --sh-3: 0 12px 28px -6px rgba(15,23,42,0.16), 0 6px 12px -6px rgba(15,23,42,0.10);
  --sh-4: 0 28px 60px -12px rgba(15,23,42,0.22);
  color-scheme: light;
}

/* ============================================================
   BASE
   ============================================================ */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  font-family: var(--font-sans);
  background: var(--bg-app);
  color: var(--text);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  transition: background var(--m-base) var(--ease), color var(--m-base) var(--ease);
}
a { color: inherit; text-decoration: none; }
button { font-family: inherit; }
::selection { background: var(--accent-soft); }

h1,h2,h3,h4 { font-family: var(--font-display); margin: 0; letter-spacing: -0.01em; }

/* Scrollbars */
* { scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 9999px; border: 2px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); background-clip: padding-box; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

/* ============================================================
   BUTTONS
   ============================================================ */
.btn {
  font-family: inherit; font-size: 13px; font-weight: 600; line-height: 1;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 0 14px; height: 38px;
  border-radius: var(--r-md);
  border: 1px solid transparent; cursor: pointer;
  white-space: nowrap; user-select: none;
  transition: background var(--m-fast) var(--ease), border-color var(--m-fast) var(--ease),
              color var(--m-fast) var(--ease), transform var(--m-fast) var(--ease), box-shadow var(--m-fast) var(--ease);
}
.btn:active { transform: translateY(1px); }
.btn svg { width: 16px; height: 16px; flex-shrink: 0; }

or: var(--text-2); max-width: 46ch; line-height: 1.6; }\n  .auth-features { display: flex; flex-direction: column; gap: 14px; margin-top: 30px; }\n  .auth-feat { display: flex; align-items: center; gap: 12px; font-size: 14px; color: var(--text-2); }\n  .auth-feat .fi { width: 32px; height: 32px; border-radius: 9px; background: var(--accent-soft); color: var(--accent-400); display:grid; place-items:center; flex-shrink:0; }\n  .auth-feat .fi svg { width: 17px; height: 17px; }\n  .auth-foot { font-size: 12px; color: var(--text-muted); display:flex; gap:16px; }\n\n  /* right form panel */\n  .auth-form-wrap { display: grid; place-items: center; padding: 40px; }\n  .auth-card { width: 100%; max-width: 392px; padding: 36px 34px; }\n  .auth-card h1 { font-size: 25px; font-weight: 700; margin-bottom: 6px; }\n  .auth-card .lead { color: var(--text-3); font-size: 14px; margin-bottom: 28px; }\n  .auth-card form { display: grid; gap: 16px; }\n  .pw-wrap { position: relative; }\n  .pw-toggle { position:absolute; right:8px; top:50%; transform:translateY(-50%); background:none; border:0; color:var(--text-3); cursor:pointer; padding:6px; border-radius:6px; display:grid; place-items:center; }\n  .pw-toggle:hover { color: var(--text); background: var(--hover); }\n  .pw-toggle svg { width:18px; height:18px; }\n  .auth-err { display:none; align-items:center; gap:8px; font-size:13px; color: var(--danger); background: var(--danger-soft); border:1px solid rgba(239,68,68,.3); padding:10px 12px; border-radius: var(--r-md); }\n  .auth-err.show { display:flex; animation: shake .4s; }\n  .auth-err svg { width:16px; height:16px; flex-shrink:0; }\n  @keyframes shake { 0%,100%{transform:translateX(0);} 20%,60%{transform:translateX(-5px);} 40%,80%{transform:translateX(5px);} }\n  .hint { font-size:12px; color: var(--text-muted); text-align:center; margin-top: 18px; padding-top:16px; border-top:1px solid var(--border-faint); }\n  .hint code { font-family: var(--font-mono); color: var(--accent-400); background: var(--accent-soft); padding: 1px 6px; border-radius: 4px; }\n  .remember { display:flex; align-items:center; gap:8px; font-size:13px; color: var(--text-2); cursor:pointer; user-select:none; }\n  .remember input { width:16px; height:16px; accent-color: var(--accent); }\n\n  @media (max-width: 880px) {\n    .auth { grid-template-columns: 1fr; }\n    .auth-brand { display: none; }\n    .auth-form-wrap { min-height: 100vh; }\n  }\n<\/style><div class=\"auth\">\n  <!-- Brand / marketing panel -->\n  <section class=\"auth-brand\">\n    <div class=\"auth-logo\">\n      <div class=\"mk\" id=\"logoMk\"><\/div>\n      <div><div class=\"nm\">Horizon<\/div><div class=\"sb\">Caption Studio<\/div><div class=\"tg\">Powered by Skytek<\/div><\/div>\n    <\/div>\n    <div class=\"auth-hero\">\n      <h2>Annotate engineering imagery with <span class=\"hl\">precision<\/span>.<\/h2>\n      <p>Drop labels, captions, icons and leader lines onto any photo. Build a reusable library of components and export production-ready annotated images.<\/p>\n      <div class=\"auth-features\">\n        <div class=\"auth-feat\"><span class=\"fi\" data-icon=\"tag\" data-size=\"17\"><\/span>Dozens of prebuilt technical labels &amp; captions<\/div>\n        <div class=\"auth-feat\"><span class=\"fi\" data-icon=\"layers\" data-size=\"17\"><\/span>Drag, resize, rotate &amp; layer with full control<\/div>\n        <div class=\"auth-feat\"><span class=\"fi\" data-icon=\"download\" data-size=\"17\"><\/span>Export to PNG, JPEG or WEBP, all annotations baked in<\/div>\n      <\/div>\n    <\/div>\n    <div class=\"auth-foot\"><span>\u00a9 2026 Skytek<\/span><span>v1.0 \u00b7 Shared workspace<\/span><\/div>\n  <\/section>\n\n  <!-- Form panel -->\n  <section class=\"auth-form-wrap\">\n    <div class=\"auth-card glass\">\n      <h1>Welcome back<\/h1>\n      <p class=\"lead\">Sign in to your annotation workspace.<\/p>\n      <div class=\"auth-err\" id=\"authErr\"><span data-icon=\"alert\" data-size=\"16\"><\/span><span id=\"authErrMsg\">Invalid credentials<\/span><\/div>\n      <form id=\"loginForm\" autocomplete=\"off\">\n        <div class=\"field\">\n          <label class=\"field-label\" for=\"username\">Username<\/label>\n          <input class=\"input\" id=\"username\" name=\"username\" placeholder=\"skytek\" autocomplete=\"username\">\n        <\/div>\n        <div class=\"field\">\n          <label class=\"field-label\" for=\"password\">Password<\/label>\n          <div class=\"pw-wrap\">\n            <input class=\"input\" id=\"password\" name=\"password\" type=\"password\" placeholder=\"\u2022\u2022\u2022\u2022\u2022\u2022\" autocomplete=\"current-password\" style=\"padding-right:42px\">\n            <button type=\"button\" class=\"pw-toggle\" id=\"pwToggle\" aria-label=\"Show password\"><span data-icon=\"eye\" data-size=\"18\"><\/span><\/button>\n          <\/div>\n        <\/div>\n        <label class=\"remember\"><input type=\"checkbox\" id=\"remember\" checked> Keep me signed in<\/label>\n        <button type=\"submit\" class=\"btn btn--primary btn--lg btn--block\">Sign in<\/button>\n      <\/form>\n    <\/div>\n  <\/section>\n<\/div>", run: function () {

  Store.seedIfEmpty();
  UI.initTheme();
  // logo mark
  document.getElementById("logoMk").innerHTML = UI.logoSVG();
  UI.hydrateIcons();

  // already signed in? skip
  if (Store.isAuthed()) App.go("dashboard.html");

  var VALID = { user: "skytek", pass: "skytek" };
  var form = document.getElementById("loginForm");
  var err = document.getElementById("authErr");
  var errMsg = document.getElementById("authErrMsg");

  // show/hide password
  document.getElementById("pwToggle").addEventListener("click", function () {
    var pw = document.getElementById("password");
    var show = pw.type === "password";
    pw.type = show ? "text" : "password";
    this.innerHTML = Icons.svg(show ? "x" : "eye", { size: 18 });
  });

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var u = document.getElementById("username").value.trim();
    var p = document.getElementById("password").value;
    if (!u || !p) { showErr("Please enter your username and password."); return; }
    if (u.toLowerCase() === VALID.user && p === VALID.pass) {
      Store.setSession({ user: VALID.user, at: Date.now(), remember: document.getElementById("remember").checked });
      var btn = form.querySelector("button[type=submit]");
      btn.textContent = "Signing in…"; btn.disabled = true;
      setTimeout(function () { App.href = "dashboard.html"; }, 480);
    } else {
      showErr("Incorrect username or password. Try skytek / skytek.");
    }
  });
  function showErr(msg) { errMsg.textContent = msg; err.classList.remove("show"); void err.offsetWidth; err.classList.add("show"); }

} };
window.__PAGES["dashboard"] = { title: "Dashboard \u00b7 Horizon Caption Studio", bodyClass: "", sheets: ["app", "pages"], html: "<div class=\"app\">\n  <div id=\"sidebarMount\"><\/div>\n  <main class=\"main\">\n    <header class=\"topbar\">\n      <button class=\"btn btn--icon btn--ghost menu-toggle\" id=\"menuToggle\" aria-label=\"Menu\"><span data-icon=\"menu\"><\/span><\/button>\n      <h1>Dashboard<\/h1>\n      <div class=\"spacer\"><\/div>\n      <button class=\"btn btn--secondary\" id=\"btnImport\"><span data-icon=\"upload\"><\/span>Import<\/button>\n      <button class=\"btn btn--primary\" id=\"btnNew\"><span data-icon=\"plus\"><\/span>New Project<\/button>\n      <button class=\"btn btn--icon btn--ghost\" id=\"themeToggle\" aria-label=\"Toggle theme\"><span data-icon=\"moon\"><\/span><\/button>\n    <\/header>\n\n    <div class=\"content\">\n      <!-- Welcome -->\n      <section class=\"welcome glass fade-in\">\n        <div class=\"welcome-text\">\n          <span class=\"badge badge--accent\" style=\"margin-bottom:12px\"><span data-icon=\"info\" data-size=\"12\"><\/span>Shared workspace<\/span>\n          <h2 id=\"welcomeTitle\">Welcome back<\/h2>\n          <p>Pick up where you left off, or start a new annotation project. Everything is saved to your shared Skytek workspace.<\/p>\n          <div class=\"row\" style=\"margin-top:18px\">\n            <button class=\"btn btn--primary\" id=\"btnNew2\"><span data-icon=\"plus\"><\/span>New Project<\/button>\n            <button class=\"btn btn--ghost\" id=\"btnResume\" style=\"display:none\"><span data-icon=\"open\"><\/span>Resume last project<\/button>\n          <\/div>\n        <\/div>\n        <div class=\"welcome-stats\" id=\"statRow\"><\/div>\n      <\/section>\n\n      <!-- Projects -->\n      <section id=\"projects\" class=\"sec\">\n        <div class=\"sec-head\" style=\"align-items:center\">\n          <h3>Projects<\/h3>\n          <span class=\"muted\" id=\"projCount\"><\/span>\n          <div class=\"spacer\" style=\"flex:1\"><\/div>\n          <div class=\"search-wrap\" style=\"display:flex;align-items:center;width:280px;max-width:42vw\">\n            <span data-icon=\"search\"><\/span>\n            <input class=\"input input--search\" id=\"globalSearch\" placeholder=\"Search projects\u2026\" style=\"width:100%\">\n          <\/div>\n        <\/div>\n        <div class=\"project-grid\" id=\"projectGrid\"><\/div>\n      <\/section>\n\n      <!-- Templates -->\n      <section id=\"templates\" class=\"sec\">\n        <div class=\"sec-head\"><h3>Templates<\/h3><span class=\"muted\">Preconfigured projects to start faster<\/span><\/div>\n        <div class=\"template-grid\" id=\"templateGrid\"><\/div>\n      <\/section>\n    <\/div>\n  <\/main>\n<\/div>\n\n<input type=\"file\" id=\"importInput\" accept=\".skproj,.zip,application/zip\" class=\"hidden\">", run: function () {
/* ============================================================
   dashboard.js — Dashboard page controller
   ============================================================ */
(function () {
  "use strict";
  if (!UI.requireAuth()) return;
  UI.initTheme();

  /* ---- shell ---- */
  document.getElementById("sidebarMount").outerHTML = UI.buildSidebar("dashboard");
  UI.wireSidebar();
  UI.hydrateIcons();

  var grid = document.getElementById("projectGrid");
  var searchEl = document.getElementById("globalSearch");
  var query = "";

  /* ---- theme toggle ---- */
  var themeBtn = document.getElementById("themeToggle");
  function syncThemeIcon() {
    var t = Store.getSettings().theme;
    themeBtn.innerHTML = ""; var span = document.createElement("span");
    span.setAttribute("data-icon", t === "dark" ? "sun" : "moon"); themeBtn.appendChild(span);
    UI.hydrateIcons(themeBtn);
  }
  themeBtn.addEventListener("click", function () { UI.toggleTheme(); syncThemeIcon(); });
  syncThemeIcon();

  /* ---- welcome + stats ---- */
  function renderStats() {
    var projects = Store.getProjects();
    var stats = [
      { v: projects.length, l: "Projects", accent: true },
      { v: Store.totalImages(), l: "Images", accent: false },
      { v: Store.getRecent().length, l: "Recently edited", accent: false },
      { v: Store.storageUsedKB() + " KB", l: "Cached", accent: false }
    ];
    document.getElementById("statRow").innerHTML = stats.map(function (s) {
      return '<div class="stat"><div class="v ' + (s.accent ? "" : "neutral") + '">' + s.v + '</div><div class="l">' + s.l + "</div></div>";
    }).join("");

    var last = Store.getProject(Store.getLastProject());
    var resume = document.getElementById("btnResume");
    if (last) {
      resume.style.display = "";
      resume.onclick = function () { App.href = "project.html?id=" + last.id; };
      resume.innerHTML = Icons.svg("open", { size: 16 }) + "Resume “" + UI.escapeHtml(last.name) + "”";
    }
  }

  /* ---- project cards ---- */
  function skeletonCard() {
    return '<div class="card project-card is-skeleton" aria-hidden="true">' +
      '<div class="pc-thumb"><div class="skel skel-thumb" style="position:absolute;inset:0"></div></div>' +
      '<div class="pc-body">' +
        '<div class="skel skel-line" style="height:15px;width:62%"></div>' +
        '<div class="skel skel-line" style="height:12px;width:100%;margin-top:4px"></div>' +
        '<div class="skel skel-line" style="height:12px;width:80%"></div>' +
        '<div class="skel skel-line" style="height:11px;width:45%;margin-top:6px"></div>' +
      '</div>' +
      '<div class="pc-foot skel-foot">' +
        '<div class="skel"></div><div class="skel" style="flex:0 0 30px"></div>' +
        '<div class="skel" style="flex:0 0 30px"></div><div class="skel" style="flex:0 0 30px"></div>' +
      '</div></div>';
  }
  function renderSkeletons(n) {
    grid.style.display = "grid";
    var cards = ""; for (var i = 0; i < (n || 6); i++) cards += skeletonCard();
    grid.innerHTML = cards;
    document.getElementById("projCount").textContent = "Loading\u2026";
  }
  var COUNT_HINT_KEY = "skytek.dash.projCount";
  function lastKnownCount() {
    var n = parseInt(__lsGet(COUNT_HINT_KEY), 10);
    return (isFinite(n) && n > 0) ? Math.min(n, 8) : 6;
  }

  function renderProjects() {
    var projects = Store.getProjects().filter(function (p) {
      return !query || (p.name + " " + p.description).toLowerCase().indexOf(query) > -1;
    });
    document.getElementById("projCount").textContent =
      projects.length + (projects.length === 1 ? " project" : " projects");
    try { localStorage.setItem(COUNT_HINT_KEY, String(Store.getProjects().length)); } catch (e) {}

    if (!projects.length) {
      grid.style.display = "block";
      grid.innerHTML =
        '<div class="empty card" style="padding:56px 20px">' +
          '<div class="empty-icon">' + Icons.svg("folder", { size: 30 }) + "</div>" +
          "<h3>" + (query ? "No matching projects" : "No projects yet") + "</h3>" +
          "<p>" + (query ? "Try a different search term." : "Create your first project to start annotating images.") + "</p>" +
          (query ? "" : '<button class="btn btn--primary" id="emptyNew">' + Icons.svg("plus", { size: 16 }) + "Create a project</button>") +
        "</div>";
      var en = document.getElementById("emptyNew"); if (en) en.addEventListener("click", newProject);
      return;
    }
    grid.style.display = "grid";
    grid.innerHTML = projects.map(function (p) {
      var thumb = p.thumbnail
        ? '<img src="' + p.thumbnail + '" alt="">'
        : '<div class="pc-thumb-empty">' + Icons.svg("image", { size: 34 }) + "<span>No images</span></div>";
      return '<div class="card project-card" data-id="' + p.id + '">' +
        '<div class="pc-thumb">' + thumb +
          '<span class="pc-count">' + Icons.svg("image", { size: 12 }) + p.images.length + "</span></div>" +
        '<div class="pc-body">' +
          '<div class="pc-name">' + UI.escapeHtml(p.name) + "</div>" +
          '<div class="pc-desc">' + (p.description ? UI.escapeHtml(p.description) : "<span class='muted'>No description</span>") + "</div>" +
          '<div class="pc-meta">' + Icons.svg("clock", { size: 13 }) + "Created " + UI.fmtDate(p.createdAt) + "</div>" +
        "</div>" +
        '<div class="pc-foot">' +
          '<button class="btn btn--secondary btn--sm" data-act="open">' + Icons.svg("open", { size: 14 }) + "Open</button>" +
          '<button class="btn btn--ghost btn--sm btn--icon" data-act="dup" title="Duplicate project">' + Icons.svg("copy", { size: 14 }) + "</button>" +
          '<button class="btn btn--ghost btn--sm btn--icon" data-act="export" title="Export project (.skproj)">' + Icons.svg("download", { size: 14 }) + "</button>" +
          '<button class="btn btn--danger btn--sm btn--icon" data-act="del" title="Delete project">' + Icons.svg("trash", { size: 14 }) + "</button>" +
        "</div></div>";
    }).join("");

    grid.querySelectorAll(".project-card").forEach(function (card) {
      var id = card.getAttribute("data-id");
      function open() { Store.setLastProject(id); App.href = "project.html?id=" + id; }
      card.querySelector('[data-act="open"]').addEventListener("click", function (e) { e.stopPropagation(); open(); });
      card.addEventListener("click", open);
      card.querySelector('[data-act="dup"]').addEventListener("click", function (e) {
        e.stopPropagation();
        var copy = Store.duplicateProject(id);
        if (copy) { UI.toast({ type: "success", title: "Project duplicated", desc: "“" + copy.name + "” created." }); renderAll(); }
        else UI.toast({ type: "danger", title: "Couldn't duplicate", desc: "Storage may be full. Clear some data in Settings." });
      });
      card.querySelector('[data-act="export"]').addEventListener("click", function (e) {
        e.stopPropagation(); exportProject(id);
      });
      card.querySelector('[data-act="del"]').addEventListener("click", function (e) {
        e.stopPropagation();
        var p = Store.getProject(id);
        UI.confirm({
          title: "Delete project?", danger: true,
          message: "“" + p.name + "” and its " + p.images.length + " image(s) will be permanently removed.",
          confirmText: "Delete", onConfirm: function () { Store.deleteProject(id); UI.toast({ type: "success", title: "Project deleted" }); renderAll(); }
        });
      });
    });
  }

  /* ---- recent images ---- */
  function renderRecent() {
    var recent = Store.getRecent().slice(0, 12);
    var el = document.getElementById("recentGrid");
    if (!recent.length) {
      el.innerHTML = '<div class="empty card" style="grid-column:1/-1;padding:40px 20px"><div class="empty-icon">' +
        Icons.svg("clock", { size: 28 }) + '</div><h3>Nothing recent</h3><p>Images you edit will appear here for quick access.</p></div>';
      return;
    }
    el.innerHTML = recent.map(function (r) {
      var img = Store.getImage(r.projectId, r.imageId);
      var thumb = (img && img.src) ? '<img src="' + img.src + '" alt="">' : Icons.svg("image", { size: 26 });
      return '<div class="card recent-card" data-pid="' + r.projectId + '" data-iid="' + r.imageId + '">' +
        '<div class="rc-thumb">' + thumb + "</div>" +
        '<div class="rc-body"><div class="rc-name">' + UI.escapeHtml(r.filename) + "</div>" +
        '<div class="rc-meta">' + UI.escapeHtml(r.projectName || "") + " · " + UI.fmtRelative(r.at) + "</div></div></div>";
    }).join("");
    el.querySelectorAll(".recent-card").forEach(function (c) {
      c.addEventListener("click", function () {
        App.href = "editor.html?project=" + c.getAttribute("data-pid") + "&image=" + c.getAttribute("data-iid");
      });
    });
  }

  /* ---- templates ---- */
  var TEMPLATES = [
    { icon: "sensor", name: "Sensor Array Audit", desc: "Label sensors, power and data lines on field equipment.", seedDesc: "Sensor & wiring annotations for the field audit." },
    { icon: "ethernet", name: "Control Cabinet", desc: "Connector callouts, leader lines and port maps.", seedDesc: "Connector and port callouts for the control cabinet." },
    { icon: "camera", name: "Drone Inspection", desc: "Mark inspection points and defects on aerial captures.", seedDesc: "Inspection-point markers from drone imagery." },
    { icon: "shield", name: "Safety Walkthrough", desc: "Highlight emergency stops, hazards and access points.", seedDesc: "Safety and hazard callouts for the walkthrough." }
  ];
  function renderTemplates() {
    document.getElementById("templateGrid").innerHTML =
      '<div class="empty card" style="grid-column:1/-1;padding:48px 24px">' +
        '<div class="empty-icon">' + Icons.svg("layout", { size: 28 }) + "</div>" +
        "<h3>Templates are coming soon</h3>" +
        "<p>Preconfigured annotation projects will land here to help you start faster.</p></div>";
  }

  /* ---- actions ---- */
  function newProject() {
    UI.modal({
      title: "New project", message: "Give your annotation project a name.",
      fields: [
        { name: "name", label: "Project name", placeholder: "e.g. Turbine Inspection — Row 12", value: "" },
        { name: "description", label: "Description (optional)", type: "textarea", placeholder: "What is this project for?" }
      ],
      confirmText: "Create project",
      onConfirm: function (data) {
        if (!data.name) { UI.toast({ type: "warning", title: "Please enter a project name" }); return false; }
        var p = Store.createProject({ name: data.name, description: data.description });
        Store.setLastProject(p.id);
        UI.toast({ type: "success", title: "Project created" });
        App.href = "project.html?id=" + p.id;
      }
    });
  }

  /* ---- export / import (.skproj) ---- */
  function downloadBlob(blob, filename) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  }
  function exportProject(id) {
    var p = Store.getProject(id);
    UI.toast({ type: "info", title: "Preparing export…", desc: "Bundling “" + (p ? p.name : "project") + "”." });
    Store.exportProject(id).then(function (res) {
      downloadBlob(res.blob, res.filename);
      UI.toast({ type: "success", title: "Project exported", desc: res.filename });
    }).catch(function (err) {
      UI.toast({ type: "danger", title: "Export failed", desc: err.message || String(err) });
    });
  }

  var importInput = document.getElementById("importInput");
  document.getElementById("btnImport").addEventListener("click", function () { importInput.value = ""; importInput.click(); });
  importInput.addEventListener("change", function () {
    var file = importInput.files && importInput.files[0];
    if (!file) return;
    if (!/\.skproj$|\.zip$/i.test(file.name)) { UI.toast({ type: "warning", title: "Choose a .skproj file" }); return; }
    UI.toast({ type: "info", title: "Importing…", desc: file.name });
    Store.importProject(file).then(function (proj) {
      UI.toast({ type: "success", title: "Project imported", desc: "“" + proj.name + "” added." });
      Store.flush(function () { App.href = "project.html?id=" + proj.id; });
    }).catch(function (err) {
      UI.toast({ type: "danger", title: "Import failed", desc: err.message || String(err) });
    });
  });

  document.getElementById("btnNew").addEventListener("click", newProject);
  document.getElementById("btnNew2").addEventListener("click", newProject);
  searchEl.addEventListener("input", function () { query = this.value.trim().toLowerCase(); renderProjects(); });

  /* ---- welcome name ---- */
  document.getElementById("welcomeTitle").textContent =
    "Welcome back, " + (Store.getSettings().fullName || "Operator").split(" ")[0];

  function renderAll() { renderStats(); renderProjects(); UI.updateSidebarCounts(); UI.hydrateIcons(); }
  renderSkeletons(lastKnownCount());
  Store.ready(function () { renderAll(); renderTemplates(); UI.hydrateIcons(); });
  Store.onChange(renderAll);

  // honor #anchor on load
  if (App.hash) { var t = document.querySelector(App.hash); if (t) t.scrollTo ? 0 : 0; }
})();

ge/jpg,image/png,image/webp\" multiple class=\"hidden\">", run: function () {

  // Compact searchable Lucide picker inside a label's Icon property group.
  function renderLabelIconPicker(o) {
    var grid = $("labelIconGrid"), search = $("labelIconSearch");
    if (!grid) return;
    function paint(q) {
      var names = Icons.lucideNames();
      if (!names.length) { grid.innerHTML = '<p class="lib-grid-more">Icons loading…</p>'; return; }
      q = (q || "").trim().toLowerCase();
      var list = (q ? names.filter(function (n) { return Icons.humanize(n).toLowerCase().indexOf(q) > -1; }) : names).slice(0, 60);
      grid.innerHTML = list.map(function (n) {
        return '<div class="lib-cell' + (n === o.iconKey ? " on" : "") + '" data-picklabelicon="' + n + '" data-hydrated="1" title="' + UI.escapeHtml(Icons.humanize(n)) + '" style="min-height:44px">' + Icons.svg(n, { size: 20 }) + "</div>";
      }).join("");
      grid.querySelectorAll("[data-picklabelicon]").forEach(function (c) {
        c.addEventListener("click", function () {
          var ob = getSel(); if (!ob) return;
          ob.iconKey = c.getAttribute("data-picklabelicon");
          renderObjects(); wireObjectEvents(); pushHistory(); markDirty();
          grid.querySelectorAll(".lib-cell").forEach(function (x) { x.classList.remove("on"); });
          c.classList.add("on");
        });
      });
    }
    if (search) search.addEventListener("input", function () { paint(search.value); });
    paint("");
  }

  function numRow(label, prop, val, min, max) {
    return '<div class="prop-row"><label>' + label + '</label><div class="ctrl"><input class="input" type="number" data-prop="' + prop + '" value="' + val + '" min="' + min + '" max="' + max + '"></div></div>';
  }
  function sliderRow(label, prop, val, min, max, unit) {
    return '<div class="prop-row"><label>' + label + '</label><div class="ctrl prop-num"><input type="range" data-prop="' + prop + '" value="' + val + '" min="' + min + '" max="' + max + '"><span class="val">' + val + (unit || "") + "</span></div></div>";
  }
  function segBtn(prop, icon, on, title) {
    return '<button data-toggle="' + prop + '" class="' + (on ? "on" : "") + '" title="' + (title || prop) + '">' + Icons.svg(icon, { size: 15 }) + "</button>";
  }
  function alignBtn(val, icon, cur) {
    return '<button data-align="' + val + '" class="' + (cur === val ? "on" : "") + '">' + Icons.svg(icon, { size: 15 }) + "</button>";
  }
  // Solid / dashed / dotted segmented control for any object with a stroke.
  function strokeStyleRow(o) {

    $("imgRibbon").classList.remove("empty");
    strip.innerHTML = project.images.map(function (im, i) {
      return '<div class="ribbon-thumb' + (im.id === imageId ? " is-current" : "") + '" data-id="' + im.id + '" draggable="true" title="' + UI.escapeHtml(im.filename) + '">' +
        '<img src="' + im.src + '" alt="">' +
        '<span class="rt-num">' + (i + 1) + "</span>" +
        '<span class="rt-acts">' +
          '<button class="rt-act" data-imgact="dup" title="Duplicate image">' + Icons.svg("copy", { size: 12 }) + "</button>" +
          '<button class="rt-act" data-imgact="replace" title="Replace image">' + Icons.svg("image", { size: 12 }) + "</button>" +
          '<button class="rt-act rt-act--del" data-imgact="del" title="Remove image">' + Icons.svg("trash", { size: 12 }) + "</button>" +
        "</span></div>";

    eye:         '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>',
    sensor:      '<circle cx="12" cy="12" r="3"/><path d="M5 5l2.5 2.5M19 5l-2.5 2.5M5 19l2.5-2.5M19 19l-2.5-2.5"/>',
    gps:         '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/>',

    dblArrow:    '<path d="M3 12h18M8 7l-5 5 5 5M16 7l5 5-5 5"/>'
  };

  function svg(name, opts) {
    opts = opts || {};
    var size = opts.size || 24;
    var inner = iconInner(name);
    var fillSet = { bolt:1, pin:1, danger:1, satellite:0 };
    var fill = opts.fill || (fillSet[name] ? "currentColor" : "none");
    var stroke = opts.stroke != null ? opts.stroke : (fill === "currentColor" && fillSet[name] ? "none" : "currentColor");
    var sw = opts.strokeWidth || 2;
    return '<svg viewBox="0 0 24 24" width="' + size + '" height="' + size + '" fill="' + fill +
      '" stroke="' + stroke + '" stroke-width="' + sw + '" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
      inner + '</svg>';
  }

  /* ---------- LUCIDE BRIDGE ----------
     The full Lucide set is loaded as a UMD global (window.lucide). Each icon is
     an array of [tag, attrs] child tuples on a 24x24 stroke grid — the same shape
     as our own registry, so they render + export through the same path lookups. */
  function lucideInner(name) {
    var L = window.lucide;
    if (!L || !L.icons) return null;
    var node = L.icons[name];
    if (!node || !node.length) return null;
    // Some builds give the full node ["svg", attrs, [children]]; others give just
    // the children array [[tag, attrs], ...]. Normalise to the children array.
    var children = (node[0] === "svg" && Array.isArray(node[2])) ? node[2] : node;
    if (!Array.isArray(children)) return null;
    return children.map(function (ch) {
      if (!Array.isArray(ch)) return "";
      var tag = ch[0], attrs = ch[1] || {};
      var a = Object.keys(attrs).map(function (k) { return k + '="' + attrs[k] + '"'; }).join(" ");
      return "<" + tag + (a ? " " + a : "") + "/>";
    }).join("");
  }
  // Inner markup for an icon key: our own registry first, then Lucide, else a fallback.
  function iconInner(name) {
    if (P[name] != null) return P[name];
    var li = lucideInner(name);
    return li != null ? li : P.tag;
  }
  function lucideNames() {
    var L = window.lucide;
    return (L && L.icons) ? Object.keys(L.icons) : [];
  }
  // "ArrowRightCircle" -> "Arrow Right Circle"
  function humanize(name) {
    return String(name).replace(/([a-z0-9])([A-Z])/g, "$1 $2").replace(/([A-Z]+)([A-Z][a-z])/g, "$1 $2");
  }

  window.Icons = { svg: svg, paths: P, inner: iconInner, lucideNames: lucideNames, humanize: humanize };

  /* ---------- COMPONENT LIBRARY ---------- */
  // Labels: a single generic label component (placeholder text "Label").
  var LABELS = ["Label"];

  // Captions: longer descriptive text blocks.
  var CAPTIONS = ["Power Connector","Emergency Shutoff","Inspection Point","Cooling System","Optical Sensor",
    "Communication Port","Fuel Intake","Primary Battery","Secondary Battery","Main Controller","Mounting Point",
    "Service Access","Ventilation","Maintenance Area","Inspection Hatch","Calibration Port","Safety Lock"];

  // Icons: stamp glyphs to place. {name, icon(key)}
  var ICONS = [
    {name:"Arrow", icon:"arrowStamp"}, {name:"Double Arrow", icon:"dblArrow"}, {name:"Warning", icon:"alert"},
    {name:"Danger", icon:"danger"}, {name:"Power", icon:"power"}, {name:"Camera", icon:"camera"},
    {name:"Bolt", icon:"bolt"}, {name:"Sensor", icon:"sensor"}, {name:"Location Pin", icon:"pin"},
    {name:"GPS", icon:"gps"}, {name:"Satellite", icon:"satellite"}, {name:"Heat", icon:"heat"},
    {name:"Snow", icon:"snow"}, {name:"Battery", icon:"battery"}, {name:"USB", icon:"usb"},
    {name:"Ethernet", icon:"ethernet"}, {name:"WiFi", icon:"wifi"}, {name:"Cloud", icon:"cloud"},
    {name:"Settings", icon:"settings"}, {name:"Shield", icon:"shield"}, {name:"Target", icon:"target"},
    {name:"Eye", icon:"eye"}, {name:"Information", icon:"info"}
  ];

  // Shapes: vector primitives drawn on canvas as DOM
  var SHAPES = [
    {name:"Rectangle", shape:"rect"}, {name:"Rounded", shape:"rrect"}, {name:"Ellipse", shape:"ellipse"},
    {name:"Triangle", shape:"triangle"}, {name:"Diamond", shape:"diamond"}, {name:"Line", shape:"line"},
    {name:"Highlight", shape:"highlight"}
  ];

  // Arrows / leader lines
  var ARROWS = [
    {name:"Arrow", shape:"arrow"},
    {name:"Leader Line", shape:"leader"}, {name:"Elbow Leader", shape:"elbow"}
  ];

  // Caption style presets used by the Properties panel & label drops
  var CAPTION_STYLES = [
    {id:"solid",    name:"Solid"},
    {id:"rounded",  name:"Rounded"},
    {id:"outline",  name:"Outlined"},
    {id:"transparent", name:"Transparent"},
    {id:"bubble",   name:"Speech Bubble"},
    {id:"callout",  name:"Callout"},
    {id:"leader",   name:"Leader Line"}
  ];

  window.Library = {
    labels: LABELS, captions: CAPTIONS, icons: ICONS,
    shapes: SHAPES, arrows: ARROWS, captionStyles: CAPTION_STYLES
  };
})();

</script>
<script>
/* ============================================================
   ui.js — shared UI helpers across all pages
   window.UI : icons, toasts, modal, confirm, theme, sidebar, format
   ============================================================ */
(function () {
  "use strict";

  /* ---- icon helper: replace <i data-icon="name"> with svg ---- */
  function hydrateIcons(root) {
    (root || document).querySelectorAll("[data-icon]").forEach(function (el) {
      if (el.dataset.hydrated) return;
      var size = parseInt(el.getAttribute("data-size") || "0", 10) || 18;
      el.innerHTML = window.Icons.svg(el.getAttribute("data-icon"), { size: size });
      el.style.display = "inline-flex";
      el.dataset.hydrated = "1";
    });
  }

  /* ---- format helpers ---- */
  function fmtDate(ts) {
    if (!ts) return "—";
    var d = new Date(ts);
    return d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
  }
  function fmtRelative(ts) {
    if (!ts) return "—";
    var diff = Date.now() - ts, m = 60000, h = 3600000, day = 86400000;
    if (diff < m) return "just now";
    if (diff < h) return Math.floor(diff / m) + "m ago";
    if (diff < day) return Math.floor(diff / h) + "h ago";
    if (diff < day * 7) return Math.floor(diff / day) + "d ago";
    return fmtDate(ts);
  }
  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  /* ---- toast ---- */
  function ensureToastRegion() {
    var r = document.querySelector(".toast-region");
    if (!r) { r = document.createElement("div"); r.className = "toast-region"; document.body.appendChild(r); }
    return r;
  }
  function toast(opts) {
    if (typeof opts === "string") opts = { title: opts };
    var type = opts.type || "info";
    var iconMap = { success: "checkCircle", warning: "alert", danger: "alert", info: "info" };
    var region = ensureToastRegion();
    var el = document.createElement("div");
    el.className = "toast toast--" + type;
    el.innerHTML =
      '<span class="ti">' + window.Icons.svg(iconMap[type], { size: 18 }) + '</span>' +
      '<div class="toast-body"><div class="toast-title">' + escapeHtml(opts.title || "") + "</div>" +
      (opts.desc ? '<div class="toast-desc">' + escapeHtml(opts.desc) + "</div>" : "") + "</div>";
    region.appendChild(el);
    var ttl = opts.duration || 3200;
    var timer = setTimeout(close, ttl);
    function close() { clearTimeout(timer); el.classList.add("is-leaving"); setTimeout(function () { el.remove(); }, 180); }
    el.addEventListener("click", close);
    return close;
  }

  /* ---- modal / confirm ---- */
  function modal(opts) {
    var scrim = document.createElement("div");
    scrim.className = "modal-scrim";
    var fields = opts.fields || [];
    var fieldsHtml = fields.map(function (f) {
      if (f.type === "textarea") {
        return '<div class="field"><label class="field-label">' + escapeHtml(f.label) + '</label>' +
          '<textarea class="textarea" data-field="' + f.name + '" placeholder="' + escapeHtml(f.placeholder || "") + '">' + escapeHtml(f.value || "") + "</textarea></div>";
      }
      return '<div class="field"><label class="field-label">' + escapeHtml(f.label) + '</label>' +
        '<input class="input" data-field="' + f.name + '" value="' + escapeHtml(f.value || "") + '" placeholder="' + escapeHtml(f.placeholder || "") + '"></div>';
    }).join("");
    var confirmClass = opts.danger ? "btn--danger" : "btn--primary";
    scrim.innerHTML =
      '<div class="modal" role="dialog" aria-modal="true">' +
        '<div class="modal-head"><h3>' + escapeHtml(opts.title || "") + "</h3>" +
          (opts.message ? "<p>" + escapeHtml(opts.message) + "</p>" : "") + "</div>" +
        (fieldsHtml ? '<div class="modal-body">' + fieldsHtml + "</div>" : '<div style="height:8px"></div>') +
        '<div class="modal-foot">' +
          '<button class="btn btn--ghost" data-act="cancel">' + escapeHtml(opts.cancelText || "Cancel") + "</button>" +
          '<button class="btn ' + confirmClass + '" data-act="ok">' + escapeHtml(opts.confirmText || "Confirm") + "</button>" +
        "</div>" +
      "</div>";
    document.body.appendChild(scrim);
    requestAnimationFrame(function () { scrim.classList.add("is-open"); });
    var firstInput = scrim.querySelector("[data-field]");
    if (firstInput) setTimeout(function () { firstInput.focus(); firstInput.select && firstInput.select(); }, 60);

    function collect() {
      var data = {};
      scrim.querySelectorAll("[data-field]").forEach(function (i) { data[i.getAttribute("data-field")] = i.value.trim(); });
      return data;
    }
    function destroy() { scrim.classList.remove("is-open"); setTimeout(function () { scrim.remove(); }, 200); document.removeEventListener("keydown", onKey); }
    function done(ok) { if (ok && opts.onConfirm) { var r = opts.onConfirm(collect()); if (r === false) return; } if (!ok && opts.onCancel) opts.onCancel(); destroy(); }
    function onKey(e) { if (e.key === "Escape") done(false); if (e.key === "Enter" && fields.length) done(true); }
    scrim.querySelector('[data-act="ok"]').addEventListener("click", function () { done(true); });
    scrim.querySelector('[data-act="cancel"]').addEventListener("click", function () { done(false); });
    scrim.addEventListener("mousedown", function (e) { if (e.target === scrim) done(false); });
    document.addEventListener("keydown", onKey);
    return { close: destroy };
  }
  function confirm(opts) {
    return modal({
      title: opts.title, message: opts.message, danger: opts.danger,
      confirmText: opts.confirmText || "Confirm", cancelText: opts.cancelText || "Cancel",
      onConfirm: opts.onConfirm, onCancel: opts.onCancel
    });
  }

  /* ---- theme ---- */
  function applyTheme(theme) {
    document.documentElement.setAttribute("data-theme", theme || "dark");
  }
  // Dark is the default. One-time reset (themeVersion 1) moves every device to
  // dark once; choosing Light in Settings afterwards is still remembered.
  function initTheme() {
    if (!window.Store) { applyTheme("dark"); return; }
    var s = window.Store.getSettings();
    if (!(s.themeVersion >= 1)) { window.Store.setSettings({ theme: "dark", themeVersion: 1 }); s.theme = "dark"; }
    applyTheme(s.theme);
  }
  function toggleTheme() {
    var cur = window.Store.getSettings().theme;
    var next = cur === "dark" ? "light" : "dark";
    window.Store.setSettings({ theme: next });
    applyTheme(next);
    return next;
  }

  /* ---- auth guard ---- */
  function requireAuth() {
    if (!window.Store.isAuthed()) { App.href = "index.html"; return false; }
    return true;
  }
  function logout() {
    window.Store.clearSession();
    App.href = "index.html";
  }

  /* ---- sidebar builder (shared shell) ----
     active: 'dashboard'|'projects'|'recent'|'templates'|'settings' */
  function buildSidebar(active) {
    var items = [
      { key: "dashboard", label: "Dashboard", icon: "grid", href: "dashboard.html" },
      { key: "projects",  label: "Projects",  icon: "folder", href: "dashboard.html#projects" },
      { key: "templates", label: "Templates", icon: "layout", href: "dashboard.html#templates" },
      { key: "settings",  label: "Settings",  icon: "settings", href: "settings.html" }
    ];
    var s = window.Store.getSettings();
    var navItems = items.map(function (it) {
      var count = "";
      if (it.key === "projects") count = '<span class="nav-count">' + window.Store.getProjects().length + "</span>";
      return '<a class="nav-item' + (active === it.key ? " is-active" : "") + '" href="' + it.href + '">' +
        '<i data-icon="' + it.icon + '"></i>' + it.label + count + "</a>";
    }).join("");
    var initials = (s.fullName || "Skytek").split(" ").map(function (w) { return w[0]; }).slice(0, 2).join("").toUpperCase();
    var html =
      '<aside class="sidebar" id="appSidebar">' +
        '<div class="sidebar-brand">' +
          '<div class="brand-mark">' + logoSVG() + "</div>" +
          '<div class="brand-text"><span class="brand-name">Horizon</span><span class="brand-sub">Caption Studio</span><span class="brand-tag">Powered by Skytek</span></div>' +
        "</div>" +
        '<nav class="nav"><div class="nav-section">Workspace</div>' + navItems +
          '<div class="nav-section">Account</div>' +
          '<a class="nav-item" id="navLogout"><i data-icon="logout"></i>Logout</a>' +
        "</nav>" +
        '<div class="nav-footer"><div class="user-chip"><div class="avatar">' + initials + "</div>" +
          '<div class="user-meta"><span class="user-name">' + escapeHtml(s.fullName) + '</span><span class="user-role">Signed in</span></div></div></div>' +
      "</aside>" +
      '<div class="sidebar-scrim" id="sidebarScrim"></div>';
    return html;
  }
  function wireSidebar() {
    hydrateIcons();
    var lo = document.getElementById("navLogout");
    if (lo) lo.addEventListener("click", function () {
      confirm({ title: "Log out?", message: "You'll need to sign in again to access your projects.", confirmText: "Log out", onConfirm: logout });
    });
    var scrim = document.getElementById("sidebarScrim");
    var sb = document.getElementById("appSidebar");
    if (scrim) scrim.addEventListener("click", function () { sb.classList.remove("is-open"); scrim.classList.remove("is-open"); });
    var mt = document.getElementById("menuToggle");
    if (mt) mt.addEventListener("click", function () { sb.classList.toggle("is-open"); scrim.classList.toggle("is-open"); });
  }

  /* ---- file → base64 (with downscale to keep localStorage sane) ---- */
  function fileToImage(file, maxDim, cb) {
    maxDim = maxDim || 1600;
    var reader = new FileReader();
    reader.onload = function (e) {
      var img = new Image();
      img.onload = function () {
        var w = img.width, h = img.height, scale = Math.min(1, maxDim / Math.max(w, h));
        var cw = Math.round(w * scale), ch = Math.round(h * scale);
        var c = document.createElement("canvas"); c.width = cw; c.height = ch;
        var ctx = c.getContext("2d"); ctx.drawImage(img, 0, 0, cw, ch);
        var isPng = /png/i.test(file.type);
        var dataUrl = c.toDataURL(isPng ? "image/png" : "image/jpeg", isPng ? undefined : 0.9);
        // Images live in IndexedDB now (roomy), so we only guard against
        // pathologically large blobs rather than the old ~1.4MB localStorage cap.
        var LIMIT = 6000000; // ~6 MB of base64 per image
        var q = 0.85;
        while (dataUrl.length > LIMIT && q >= 0.4) {
          dataUrl = c.toDataURL("image/jpeg", q);
          q -= 0.12;
        }
        cb({ src: dataUrl, w: cw, h: ch, filename: file.name });
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  // Refresh the sidebar's Projects count (data loads async now, after the
  // shell is built).
  function updateSidebarCounts() {
    var el = document.querySelector(".nav-count");
    if (el && window.Store) el.textContent = window.Store.getProjects().length;
  }

  // Rename an image (project gallery + editor). Selects the name, not the extension.
  function renameImage(projectId, imageId, onDone) {
    var im = Store.getImage(projectId, imageId); if (!im) return;
    modal({
      title: "Rename image",
      fields: [{ name: "filename", label: "Image name", value: im.filename, placeholder: "e.g. bay4-inspection.png" }],
      confirmText: "Rename",
      onConfirm: function (data) {
        var name = String(data.filename || "").replace(/[\\/]+/g, "-").trim().slice(0, 120);
        if (!name) { toast({ type: "warning", title: "Name can’t be empty" }); return false; }
        if (name === im.filename) return;
        Store.updateImage(projectId, imageId, { filename: name });
        toast({ type: "success", title: "Image renamed", desc: name });
        if (onDone) onDone(name);
      }
    });
    setTimeout(function () {
      var inp = document.querySelector('.modal [data-field="filename"]'); if (!inp) return;
      var dot = inp.value.lastIndexOf(".");
      try { inp.setSelectionRange(0, dot > 0 ? dot : inp.value.length); } catch (e) {}
    }, 90);

    filename = filename || "download";
    if (/\.skproj$/i.test(filename)) filename += ".zip";
    var blobP = hrefToBlob(href);   // resolved right away, before the page can revoke the link
    Promise.all([getDownloads(), blobP]).then(function (res) {
      var dl = res[0], blob = res[1];
      if (!dl) {
        if (window.Store && Store.isLocal && Store.isLocal()) {   // plain web page: ordinary browser download
          var u = URL.createObjectURL(blob), a = document.createElement("a");
          a.href = u; a.download = filename.replace(/\.skproj\.zip$/i, ".skproj"); origClick.call(a);
          setTimeout(function () { URL.revokeObjectURL(u); }, 4000);
          return;
        }
        if (window.UI) UI.toast({ type: "warning", title: "Downloads aren’t available here" }); return;
      }
      return dl.save({ filename: filename, data: blob }).catch(function (e) {
        if (e && e.code === "declined") return;
        if (window.UI) UI.toast({ type: "danger", title: "Download failed", desc: (e && e.message) || "" });
      });
    }).catch(function (e) {
      console.error(e);
      if (window.UI) UI.toast({ type: "danger", title: "Download failed", desc: (e && e.message) || "The file couldn’t be prepared." });
    });
  }
  var origClick = HTMLAnchorElement.prototype.click;
  HTMLAnchorElement.prototype.click = function () {
    if (this.hasAttribute("download") && this.href) { saveFile(this.href, this.getAttribute("download")); return; }
    return origClick.call(this);
  };

  /* ---- link interception ---- */
  docAdd("click", function (e) {
    if (e.defaultPrevented || e.button !== 0) return;
    var a = e.target.closest && e.target.closest("a[href]");
    if (!a) return;
    if (a.hasAttribute("download")) { e.preventDefault(); saveFile(a.href, a.getAttribute("download")); return; }
    var h = a.getAttribute("href");
    if (/^(\.\/)?(index|dashboard|project|editor|settings)\.html/i.test(h) || (/^#[a-z]/i.test(h) && current && document.getElementById(h.slice(1)) === null)) {
      e.preventDefault();
      go(h);
    }
  });
  winAdd("popstate", function () {
    var r = fromToken(location.hash);
    if (r) go(r, { replace: true });
  });

  /* ---- AI (sample capability) ---- */
  var sampleCap = null;
  function complete(req) {
    if (!sampleCap) return Promise.reject(new Error("AI is not available in this environment."));
    var tools = (req.tools || []).map(function (t) {
      return { name: t.name, description: t.description, inputSchema: t.input_schema, execute: function (input) { return t.run(input || {}); } };
    });
    var userText = (req.messages || []).map(function (m) { return typeof m.content === "string" ? m.content : ""; }).join("\n\n");
    var input = (req.system ? req.system + "\n\n" : "") + "User request: " + userText;
    return sampleCap(input, { tools: tools, modelTier: "default", cache: false })
      .then(function (r) { return (r && r.text) || ""; })
      .catch(function (e) {
        if (e && e.code === "not_granted") throw new Error("AI access wasn’t granted for this page.");
        if (e && e.code === "rate_limited") throw new Error("Too many requests — try again in a moment.");
        throw new Error((e && e.message) || "Request failed");
      });
  }

  window.App = {
    search: "", hash: "",
    go: go,
    reload: function () { if (current) go(current, { replace: true }); },
    complete: complete,
    hasAI: function () { return !!sampleCap; },
    start: function () {
      var r = fromToken(location.hash);
      if (!r) r = { page: "login", search: "", frag: "" };
      mount(r, false);
      try { history.replaceState({ t: toToken(r) }, "", "#" + toToken(r)); } catch (e) {}
    }
  };
  Object.defineProperty(window.App, "href", { set: function (v) { go(v); }, get: function () { return ""; } });
})();

</script>
<script>App.start();</script>
</body>
